<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – complete</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#5BD18B}a:hover{color:#8BE2AE}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 48px; background: #101317; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 32px">
  <div style="width: 112px; height: 112px; border-radius: 999px; background: #5BD18B; display: flex; align-items: center; justify-content: center" role="img" aria-label="Completed">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#101317" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 48px; font-weight: 700">Circuit complete</h1>
    <span style="font-size: 18px; color: #A3ADB8">Full body circuit · Thursday 22 October</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; width: 960px">
    <div style="padding: 20px; border-radius: 20px; background: #1A1F25; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; color: #A3ADB8">Time</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700">44:12</span></div>
    <div style="padding: 20px; border-radius: 20px; background: #1A1F25; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; color: #A3ADB8">Rounds</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700">5 / 5</span></div>
    <div style="padding: 20px; border-radius: 20px; background: #1A1F25; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; color: #A3ADB8">Trained</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">Thomas, Anna</span></div>
    <div style="padding: 20px; border-radius: 20px; background: #2A2018; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 15px; color: #FFB07A">Streak</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 40px; font-weight: 700">7 days</span></div>
  </div>

  <div style="width: 960px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 18px; font-weight: 600">How did it feel?</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <button style="height: 64px; border-radius: 16px; border: 1px solid #2E363F; background: transparent; color: #F3F5F7; font: 600 18px Inter, sans-serif">Too easy</button>
      <button style="height: 64px; border-radius: 16px; border: 2px solid #5BD18B; background: #16281E; color: #F3F5F7; font: 600 18px Inter, sans-serif">Just right</button>
      <button style="height: 64px; border-radius: 16px; border: 1px solid #2E363F; background: transparent; color: #F3F5F7; font: 600 18px Inter, sans-serif">Too hard</button>
    </div>
    <span style="font-size: 14px; color: #A3ADB8">Saved with the session – Claude uses it when you ask it to adjust the program</span>
  </div>

  <a href="Main.html" style="margin-top: auto; width: 360px; height: 72px; border-radius: 18px; background: #F3F5F7; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; text-decoration: none">Done</a>
</div>
</body>
</html>
