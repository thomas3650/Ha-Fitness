<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – Circuit timer, 4 participants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFB07A}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 32px 48px; background: #101317; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px">
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Round</span> <strong>2 / 5</strong></div>
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Interval</span> <strong>3 / 8</strong></div>
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Participants</span> <strong>4</strong></div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 14px; border-radius: 999px; background: #1A1F25">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        <span style="font-size: 15px; font-weight: 600">Workout Mix</span>
        <button aria-label="Pause music" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: #232A31; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
      </div>
      <span style="font-size: 17px; color: #A3ADB8"><strong style="color: #F3F5F7; font-family: 'Space Grotesk', sans-serif">11:20</strong> / 44:00</span>
      <a href="Complete.html" style="height: 48px; padding: 0 20px; border-radius: 14px; background: #1A1F25; color: #F3F5F7; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">End</a>
    </div>
  </header>

  <div style="display: flex; gap: 28px; flex-grow: 1; min-height: 0">
    <div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px">
      <div style="position: relative; width: 320px; height: 320px">
        <svg width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="32 seconds of 45 left">
          <circle cx="160" cy="160" r="138" fill="none" stroke="#1A1F25" stroke-width="22"/>
          <circle cx="160" cy="160" r="138" fill="none" stroke="#FF8A3D" stroke-width="22" stroke-linecap="round" stroke-dasharray="616 867" transform="rotate(-90 160 160)"/>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          <span style="font-size: 19px; font-weight: 600; letter-spacing: 4px; color: #FF8A3D">WORK</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 120px; font-weight: 700; line-height: 1">32</span>
          <span style="font-size: 15px; color: #A3ADB8">then 15 s to switch</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 24px">
        <button aria-label="Previous interval" style="width: 64px; height: 64px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <a href="TimerRest.html" aria-label="Pause" style="width: 96px; height: 96px; border-radius: 999px; background: #F3F5F7; color: #101317; display: flex; align-items: center; justify-content: center">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </a>
        <button aria-label="Skip interval" style="width: 64px; height: 64px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
      </div>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="box-sizing: border-box; padding: 14px; border-radius: 20px; background: #1A1F25; border-top: 6px solid #B18CFF; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: #B18CFF; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">1</span>
          <span style="font-size: 17px; font-weight: 700">Thomas</span><span style="font-size: 15px; color: #A3ADB8">· St. 3</span>
          <span style="margin-left: auto; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Goblet squat</span>
        </div>
        <img src="gifs/goblet_squat.gif" alt="Goblet squat demonstration" style="width: 100%; flex-grow: 1; min-height: 0; border-radius: 12px; background: #FFFFFF; object-fit: contain">
        <span style="font-size: 14px; color: #A3ADB8">Next: Burpee</span>
      </div>
      <div style="box-sizing: border-box; padding: 14px; border-radius: 20px; background: #1A1F25; border-top: 6px solid #3DD6C6; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: #3DD6C6; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">2</span>
          <span style="font-size: 17px; font-weight: 700">Anna</span><span style="font-size: 15px; color: #A3ADB8">· St. 4</span>
          <span style="margin-left: auto; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Burpee</span>
        </div>
        <img src="gifs/burpee.gif" alt="Burpee demonstration" style="width: 100%; flex-grow: 1; min-height: 0; border-radius: 12px; background: #FFFFFF; object-fit: contain">
        <span style="font-size: 14px; color: #A3ADB8">Next: Jump squat</span>
      </div>
      <div style="box-sizing: border-box; padding: 14px; border-radius: 20px; background: #1A1F25; border-top: 6px solid #F5C451; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: #F5C451; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">3</span>
          <span style="font-size: 17px; font-weight: 700">Emil</span><span style="font-size: 15px; color: #A3ADB8">· St. 5</span>
          <span style="margin-left: auto; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Jump squat</span>
        </div>
        <img src="gifs/jump_squat.gif" alt="Jump squat demonstration" style="width: 100%; flex-grow: 1; min-height: 0; border-radius: 12px; background: #FFFFFF; object-fit: contain">
        <span style="font-size: 14px; color: #A3ADB8">Next: Shoulder taps</span>
      </div>
      <div style="box-sizing: border-box; padding: 14px; border-radius: 20px; background: #1A1F25; border-top: 6px solid #FF7AB6; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: #FF7AB6; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">4</span>
          <span style="font-size: 17px; font-weight: 700">Guest</span><span style="font-size: 15px; color: #A3ADB8">· St. 6</span>
          <span style="margin-left: auto; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700">Shoulder taps</span>
        </div>
        <img src="gifs/plank_shoulder_taps.gif" alt="Plank shoulder taps demonstration" style="width: 100%; flex-grow: 1; min-height: 0; border-radius: 12px; background: #FFFFFF; object-fit: contain">
        <span style="font-size: 14px; color: #A3ADB8">Next: Kettlebell swing</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
