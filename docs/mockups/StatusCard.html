<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – status card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFB07A}
</style>
</head>
<body>
<div style="width: 440px; height: 280px; box-sizing: border-box; padding: 24px; background: #1A1F25; border-radius: 20px; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <span style="font-size: 14px; font-weight: 600; letter-spacing: 1.2px; color: #A3ADB8">WORKOUT</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
      6 days
    </span>
  </div>
  <div style="display: flex; align-items: center; gap: 20px">
    <div style="position: relative; width: 104px; height: 104px; flex-shrink: 0">
      <svg width="104" height="104" viewBox="0 0 104 104" role="img" aria-label="2 of 4 circuits done this week">
        <circle cx="52" cy="52" r="44" fill="none" stroke="#232A31" stroke-width="12"/>
        <circle cx="52" cy="52" r="44" fill="none" stroke="#5BD18B" stroke-width="12" stroke-linecap="round" stroke-dasharray="138 277" transform="rotate(-90 52 52)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700">2/4</span><span style="font-size: 11px; color: #A3ADB8">this week</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600">Full body circuit</span>
      <span style="font-size: 15px; color: #A3ADB8">Due today · reminder 18:00</span>
      <span style="font-size: 15px; color: #A3ADB8">8 stations · 44 min</span>
    </div>
  </div>
  <a href="Main.html" style="margin-top: auto; height: 52px; border-radius: 14px; background: #FF8A3D; color: #101317; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; text-decoration: none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#101317" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
    Start
  </a>
</div>
</body>
</html>
