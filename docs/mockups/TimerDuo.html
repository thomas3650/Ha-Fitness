<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – Circuit timer, 2 participants</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFB07A}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 36px 48px; background: #101317; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px">
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Round</span> <strong>2 / 5</strong></div>
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Interval</span> <strong>3 / 8</strong></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; width: 360px; height: 56px; box-sizing: border-box; padding: 0 8px 0 9px; border-radius: 999px; background: #1A1F25">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: #2A2018; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
        <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Workout Mix</span>
        <span style="font-size: 13px; color: #A3ADB8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Living room speaker</span>
      </div>
      <button aria-label="Pause music" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #232A31; color: #F3F5F7; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-size: 17px; color: #A3ADB8"><strong style="color: #F3F5F7; font-family: 'Space Grotesk', sans-serif">11:20</strong> / 44:00</span>
      <a href="Complete.html" style="height: 48px; padding: 0 20px; border-radius: 14px; background: #1A1F25; color: #F3F5F7; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">End</a>
    </div>
  </header>

  <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1">
    <div style="width: 380px; box-sizing: border-box; padding: 18px; border-radius: 24px; background: #1A1F25; border-top: 6px solid #B18CFF; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #B18CFF; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">1</span>
        <span style="font-size: 22px; font-weight: 700">Thomas</span><span style="margin-left: auto; font-size: 18px; color: #A3ADB8">Station <strong style="color: #F3F5F7">3</strong></span>
      </div>
      <img src="gifs/goblet_squat.gif" alt="Goblet squat demonstration" style="width: 100%; height: 280px; border-radius: 16px; background: #FFFFFF; object-fit: contain">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">Goblet squat</div>
      <span style="font-size: 15px; color: #A3ADB8">Next: station 4 · Burpee</span>
    </div>

    <div style="position: relative; width: 340px; height: 340px">
      <svg width="340" height="340" viewBox="0 0 340 340" role="img" aria-label="32 seconds of 45 left">
        <circle cx="170" cy="170" r="146" fill="none" stroke="#1A1F25" stroke-width="24"/>
        <circle cx="170" cy="170" r="146" fill="none" stroke="#FF8A3D" stroke-width="24" stroke-linecap="round" stroke-dasharray="652 917" transform="rotate(-90 170 170)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 20px; font-weight: 600; letter-spacing: 4px; color: #FF8A3D">WORK</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 130px; font-weight: 700; line-height: 1">32</span>
        <span style="font-size: 16px; color: #A3ADB8">then 15 s to switch</span>
      </div>
    </div>

    <div style="width: 380px; box-sizing: border-box; padding: 18px; border-radius: 24px; background: #1A1F25; border-top: 6px solid #3DD6C6; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 40px; height: 40px; border-radius: 999px; background: #3DD6C6; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">2</span>
        <span style="font-size: 22px; font-weight: 700">Anna</span><span style="margin-left: auto; font-size: 18px; color: #A3ADB8">Station <strong style="color: #F3F5F7">4</strong></span>
      </div>
      <img src="gifs/burpee.gif" alt="Burpee demonstration" style="width: 100%; height: 280px; border-radius: 16px; background: #FFFFFF; object-fit: contain">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">Burpee</div>
      <span style="font-size: 15px; color: #A3ADB8">Next: station 5 · Jump squat</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 32px">
    <button aria-label="Previous interval" style="width: 72px; height: 72px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <a href="TimerRest.html" aria-label="Pause" style="width: 104px; height: 104px; border-radius: 999px; background: #F3F5F7; color: #101317; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </a>
    <button aria-label="Skip interval" style="width: 72px; height: 72px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
  </div>
</div>
</body>
</html>
