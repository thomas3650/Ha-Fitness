<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – Timer, rest phase paused</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4DA8FF}a:hover{color:#8CC6FF}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 36px 48px; background: #101317; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; gap: 12px">
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Round</span> <strong>3 / 5</strong></div>
      <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Station</span> <strong>4 / 8</strong></div>
      <div style="padding: 10px 18px; border-radius: 999px; background: #F3F5F7; color: #101317; font-size: 17px; font-weight: 700; letter-spacing: 1px">PAUSED</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; width: 360px; height: 56px; box-sizing: border-box; padding: 0 8px 0 9px; border-radius: 999px; background: #1A1F25">
      <div style="width: 38px; height: 38px; border-radius: 999px; background: #232A31; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3ADB8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
        <span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Workout Mix</span>
        <span style="font-size: 13px; color: #A3ADB8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Paused with the workout</span>
      </div>
      <button aria-label="Play music" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #232A31; color: #F3F5F7; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 16px">
      <span style="font-size: 17px; color: #A3ADB8"><strong style="color: #F3F5F7; font-family: 'Space Grotesk', sans-serif">19:21</strong> / 44:00</span>
      <a href="Complete.html" style="height: 48px; padding: 0 20px; border-radius: 14px; background: #1A1F25; color: #F3F5F7; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">End</a>
    </div>
  </header>

  <div style="display: flex; align-items: center; justify-content: space-between; flex-grow: 1">
    <div style="width: 320px; display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 14px; font-weight: 600; letter-spacing: 1.2px; color: #4DA8FF">MOVE TO NEXT STATION</span>
      <img src="gifs/jump_squat.gif" alt="Jump squat demonstration" style="width: 320px; height: 320px; border-radius: 24px; background: #FFFFFF; object-fit: contain">
      <div style="font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700">Jump squat</div>
    </div>

    <div style="position: relative; width: 460px; height: 460px; opacity: 0.85">
      <svg width="460" height="460" viewBox="0 0 460 460" role="img" aria-label="9 seconds of 15 rest left, paused">
        <circle cx="230" cy="230" r="200" fill="none" stroke="#1A1F25" stroke-width="28"/>
        <circle cx="230" cy="230" r="200" fill="none" stroke="#4DA8FF" stroke-width="28" stroke-linecap="round" stroke-dasharray="754 1257" transform="rotate(-90 230 230)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-size: 22px; font-weight: 600; letter-spacing: 4px; color: #4DA8FF">SWITCH</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 168px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">9</span>
        <span style="font-size: 18px; color: #A3ADB8">tap ring to resume</span>
      </div>
    </div>

    <div style="width: 260px; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 20px; background: #1A1F25">
      <span style="font-size: 14px; font-weight: 600; letter-spacing: 1.2px; color: #A3ADB8">THEN</span>
      <img src="gifs/plank_shoulder_taps.gif" alt="Plank shoulder taps demonstration" style="width: 100%; height: 180px; border-radius: 14px; background: #FFFFFF; object-fit: contain">
      <span style="font-size: 20px; font-weight: 600">Shoulder taps</span>
      <span style="font-size: 15px; color: #A3ADB8">45 s</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 32px">
    <button aria-label="Previous phase" style="width: 72px; height: 72px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <a href="Timer.html" aria-label="Resume" style="width: 104px; height: 104px; border-radius: 999px; background: #4DA8FF; color: #101317; display: flex; align-items: center; justify-content: center">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
    </a>
    <button aria-label="Skip rest" style="width: 72px; height: 72px; border-radius: 999px; border: 0; background: #1A1F25; color: #F3F5F7; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
  </div>

  <div style="height: 8px; border-radius: 999px; background: #1A1F25; display: flex"><div style="width: 48%; border-radius: 999px; background: #4DA8FF"></div></div>
</div>
</body>
</html>
