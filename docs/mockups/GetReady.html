<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout – get ready countdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF8A3D}a:hover{color:#FFB07A}
</style>
</head>
<body>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 36px 48px; background: #101317; color: #F3F5F7; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="padding: 10px 18px; border-radius: 999px; background: #1A1F25; font-size: 17px"><span style="color: #A3ADB8">Full body circuit</span> · <strong>2 participants · 5 rounds · 44 min</strong></div>
    <a href="Main.html" style="height: 48px; padding: 0 20px; border-radius: 14px; background: #1A1F25; color: #F3F5F7; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Cancel</a>
  </header>

  <div style="display: flex; align-items: center; justify-content: center; gap: 96px; flex-grow: 1">
    <div style="position: relative; width: 420px; height: 420px">
      <svg width="420" height="420" viewBox="0 0 420 420" role="img" aria-label="Starting in 5 seconds">
        <circle cx="210" cy="210" r="180" fill="none" stroke="#1A1F25" stroke-width="24"/>
        <circle cx="210" cy="210" r="180" fill="none" stroke="#F3F5F7" stroke-width="24" stroke-linecap="round" stroke-dasharray="565 1131" transform="rotate(-90 210 210)"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
        <span style="font-size: 22px; font-weight: 600; letter-spacing: 4px; color: #A3ADB8">GET READY</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 180px; font-weight: 700; line-height: 1">5</span>
      </div>
    </div>
    <div style="width: 440px; display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: 1.2px; color: #FF8A3D">GO TO YOUR START STATION</span>
      <div style="display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 20px; background: #1A1F25; border-left: 6px solid #B18CFF">
        <span style="width: 44px; height: 44px; border-radius: 999px; background: #B18CFF; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; flex-shrink: 0">1</span>
        <img src="gifs/push_up.gif" alt="Push-up demonstration" style="width: 130px; height: 130px; border-radius: 14px; background: #FFFFFF; object-fit: contain">
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #A3ADB8"><strong style="color: #F3F5F7">Thomas</strong> · Station 1</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Push-up</span></div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 20px; background: #1A1F25; border-left: 6px solid #3DD6C6">
        <span style="width: 44px; height: 44px; border-radius: 999px; background: #3DD6C6; color: #101317; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; flex-shrink: 0">2</span>
        <img src="gifs/dumbbell_row.gif" alt="Dumbbell row demonstration" style="width: 130px; height: 130px; border-radius: 14px; background: #FFFFFF; object-fit: contain">
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #A3ADB8"><strong style="color: #F3F5F7">Anna</strong> · Station 2</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700">Dumbbell row</span></div>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: center">
    <a href="TimerDuo.html" style="height: 64px; padding: 0 36px; border-radius: 18px; background: #232A31; color: #F3F5F7; font-size: 18px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Start now</a>
  </div>
</div>
</body>
</html>
