version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directories:
      - /
      - /addon/server
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      uv:
        patterns: ["*"]
    # Bumped by hand, together with the Home Assistant version (docs/ha-notes.md, Bumping Home Assistant).
    ignore:
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: home-assistant-frontend
      - dependency-name: homeassistant
  - package-ecosystem: npm
    directories:
      - /cards
      - /addon/web
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    # Held at 6.0.x until typescript-eslint supports newer (docs/notes.md).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      pre-commit:
        patterns: ["*"]
