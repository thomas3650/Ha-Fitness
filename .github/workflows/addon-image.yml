name: addon-image
# Builds and pushes the add-on image when the registry has no image yet for the version in addon/config.yaml
# (set by the add-on's release PR). It runs on a push to main that changes addon/config.yaml, and by hand
# (workflow_dispatch, main only). The registry decides, not git: a run that GitHub replaced in the queue is made up by
# the next run. To build a missed version, dispatch the workflow on main (or re-run the latest run, not an older one);
# it skips a version that has an image.
# Steps follow home-assistant/apps-example's build-app.yaml.
on:
  push:
    branches: [main]
    paths:
      - addon/config.yaml
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

# One run at a time, in push order, so an older version never overwrites :latest after a newer one.
concurrency:
  group: addon-image
  cancel-in-progress: false

env:
  REGISTRY_PREFIX: ghcr.io/thomas3650
  IMAGE_NAME: ha-fitness-addon

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      architectures: ${{ steps.version.outputs.architectures }}
      name: ${{ steps.version.outputs.name }}
      description: ${{ steps.version.outputs.description }}
      url: ${{ steps.version.outputs.url }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Does the version have an image?
        id: version
        env:
          REF: ${{ github.ref }}
        run: |
          # A dispatch from another branch would push unreviewed code as :latest.
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main only (got ${REF})"
            exit 1
          fi
          # yq (mikefarah) and jq are preinstalled on GitHub's Ubuntu runners.
          version="$(yq -r '.version' addon/config.yaml)"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "::error::No version in addon/config.yaml"
            exit 1
          fi
          # The multi-arch manifest that publish-multi-arch-manifest pushes: ${REGISTRY_PREFIX}/${IMAGE_NAME}:<version>.
          registry="${REGISTRY_PREFIX%%/*}"
          repository="${REGISTRY_PREFIX#*/}/${IMAGE_NAME}"
          body="$(mktemp)"
          # An anonymous pull token. A missing or non-public package answers 403 here; with that token the
          # manifest check would answer 404, so anything but a token is an error, never "missing".
          status="$(curl -sS -o "${body}" -w '%{http_code}' \
            "https://${registry}/token?scope=repository:${repository}:pull")" \
            || { echo "::error::Could not reach ${registry} for a pull token"; exit 1; }
          if [ "${status}" != "200" ]; then
            cat "${body}"
            echo "::error::No anonymous pull token for ${repository} (HTTP ${status}); is the package public?"
            exit 1
          fi
          token="$(jq -r '.token // empty' "${body}")"
          if [ -z "${token}" ]; then
            echo "::error::The token response for ${repository} has no token"
            exit 1
          fi
          status="$(curl -sS -o /dev/null -I -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://${registry}/v2/${repository}/manifests/${version}")" \
            || { echo "::error::Could not reach ${registry} to check ${repository}:${version}"; exit 1; }
          case "${status}" in
            200)
              echo "${registry}/${repository}:${version} exists: nothing to build"
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            404)
              echo "${registry}/${repository}:${version} is missing: building it"
              ;;
            *)
              echo "::error::Could not check ${registry}/${repository}:${version} (HTTP ${status})"
              exit 1
              ;;
          esac
          {
            echo "changed=true"
            echo "version=${version}"
            echo "architectures=$(yq -o=json -I=0 '.arch' addon/config.yaml)"
            echo "name=$(yq -r '.name' addon/config.yaml)"
            echo "description=$(yq -r '.description' addon/config.yaml)"
            echo "url=$(yq -r '.url' addon/config.yaml)"
          } >> "$GITHUB_OUTPUT"
      - name: Prepare build matrix
        id: matrix
        if: steps.version.outputs.changed == 'true'
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          architectures: ${{ steps.version.outputs.architectures }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          # No cache in a workflow that publishes (cache poisoning).
          cache-gha: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./addon
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
