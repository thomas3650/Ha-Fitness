name: release-please
# Opens one release PR per component (the add-on, and the integration with its cards) and, when one
# is merged, tags it and creates a draft release. The integration's draft is published here only once
# ha_fitness.zip is attached, so HACS never sees a release without it. The add-on's draft stays a
# draft: addon-image.yml builds its image from the version bump in addon/config.yaml.
on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      # Only used if RELEASE_PLEASE_TOKEN is missing; that token has the same scopes for this repo.
      contents: write
      pull-requests: write
      issues: write
    outputs:
      # Path "." (the integration) has the bare output names; the add-on's are prefixed "addon--".
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # A PAT, so CI runs on the release PRs. github.token works too, but its PRs trigger no workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  integration-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Tag must match manifest.json version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("custom_components/ha_fitness/manifest.json"))["version"])')"
          test "${TAG}" = "v${version}" || { echo "Tag ${TAG} != v${version}"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          # No cache in a workflow that publishes a release (cache poisoning).
          package-manager-cache: false
      - name: Build the cards
        run: |
          npm ci --prefix cards
          npm run build --prefix cards
      - name: Zip the integration
        run: |
          # The contents of custom_components/ha_fitness/ at the zip root, as HACS expects.
          (cd custom_components/ha_fitness && zip -r "${GITHUB_WORKSPACE}/ha_fitness.zip" . -x '*__pycache__*')
          unzip -Z1 ha_fitness.zip > zip-contents.txt
          grep -qx manifest.json zip-contents.txt || { echo "manifest.json is not at the zip root"; exit 1; }
          grep -qx frontend/ha-fitness-cards.js zip-contents.txt || { echo "frontend/ha-fitness-cards.js is not in the zip"; exit 1; }
      - name: Attach the zip and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${TAG}" ha_fitness.zip --clobber
          gh release edit "${TAG}" --draft=false --latest
