# https://contributors.home-assistant.io/apps/reference/configuration/
name: HA Fitness
version: "1.1.0"  # x-release-please-version
slug: ha_fitness
description: Circuit training at home - the server behind the HA Fitness integration.
url: https://github.com/thomas3650/Ha-Fitness/tree/main/addon
arch:
  - aarch64
  - amd64
image: ghcr.io/thomas3650/ha-fitness-addon
init: false
homeassistant_api: true
# Tells HA where the API is, so it offers to set up the integration (step 4 spec §3.7).
discovery:
  - ha_fitness
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: HA Fitness API (REST and MCP)
ingress: true
ingress_port: 8765
panel_icon: mdi:dumbbell
panel_title: HA Fitness
# How many days after its date a missed training stays open (today-ahead spec §2.1.5); read at the start.
options:
  late_days: 2
schema:
  late_days: "int(0,6)"
# A consistent copy of the database (backup/snapshot.db) before each hot backup; the live database and the
# downloaded media are left out (the media is downloaded again after a restore).
backup_pre: /usr/bin/with-contenv /opt/venv/bin/python -m ha_fitness_server.snapshot
backup_exclude:
  - ha_fitness.db
  - ha_fitness.db-wal
  - ha_fitness.db-shm
  - library/media
