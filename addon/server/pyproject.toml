[project]
name = "ha-fitness-server"
# release-please bumps __version__ (x-release-please-version); hatchling reads it from there.
dynamic = ["version"]
description = "The HA Fitness add-on server: REST API for workouts, programs and stats."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.20.1",
  "anyio>=4.15.1",
  "fastapi",
  "fastmcp==4.1.3",
  "httpx>=0.28.1",
  "sqlalchemy>=2.1.6",
  "tzdata>=2026.5",
  "uvicorn",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-timeout",
  "mypy",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ha_fitness_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_fitness_server"]

[tool.coverage.report]
fail_under = 90

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hanging test fails instead of blocking the run; the slowest test takes about 2 s. The signal method fails
# only the test and the run goes on; the thread method ends the whole run.
timeout = 60
timeout_method = "signal"

# mypy does not read the root pyproject.toml; ruff does (this file has no [tool.ruff]).
[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
